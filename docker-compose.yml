services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434/api/chat
    volumes:
      - ./data:/app/data:ro
    command: uvicorn api.app:app --host 0.0.0.0 --port 8000

  ui:
    build: .
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    command: streamlit run ui.py --server.address 0.0.0.0
